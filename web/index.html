<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>论文阅读</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-title">
    <h1 id="paper-title">正在打开论文…</h1>
    <p id="paper-meta" class="topbar-meta"></p>
  </div>
  <div class="topbar-side">
    <ol id="steps" class="steps" aria-label="主线进度"></ol>
    <span id="mode-chip" class="chip" hidden></span>
  </div>
</header>

<main class="layout">
  <section id="paper-pane" class="pane paper-pane" aria-label="论文原文" tabindex="0">
    <article id="paper" class="paper"></article>
  </section>

  <section class="pane agent-pane" aria-label="讲解">
    <div id="cards" class="cards" aria-live="polite"></div>

    <form id="composer" class="composer">
      <p id="status" class="status" role="status"></p>
      <div id="quote-chip" class="quote-chip" hidden>
        <span class="quote-label">选中的原文</span>
        <span id="quote-text" class="quote-text"></span>
        <button type="button" id="quote-clear" class="icon-btn" aria-label="取消选中的原文">×</button>
      </div>
      <label class="sr-only" for="question">想问的问题</label>
      <textarea id="question" rows="2" placeholder="可以在左边选中一段原文再提问，也可以直接写问题。"></textarea>
      <div class="composer-actions">
        <button type="submit" id="ask-btn" class="btn" disabled>提问</button>
        <button type="button" id="continue-btn" class="btn btn-primary">继续</button>
      </div>
    </form>
  </section>
</main>

<button type="button" id="ask-selection" class="ask-selection" hidden>问这一段</button>

<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
