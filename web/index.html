<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>论文阅读</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="vendor/pdfjs/text_layer.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-title">
    <h1 id="paper-title">正在打开论文…</h1>
    <p id="paper-meta" class="topbar-meta"></p>
  </div>
  <div class="topbar-side">
    <ol id="steps" class="steps" aria-label="主线进度"></ol>
    <div id="view-switch" class="view-switch" role="group" aria-label="显示哪一边">
      <button type="button" data-view="paper" aria-pressed="false" title="只看原文">原文</button>
      <button type="button" data-view="both" aria-pressed="true" title="原文和讲解并排">并排</button>
      <button type="button" data-view="agent" aria-pressed="false" title="只看讲解">讲解</button>
    </div>
    <button type="button" id="map-btn" class="chip chip-btn" title="把讲过的概念画成一张图" hidden>地图</button>
    <button type="button" id="record-btn" class="chip chip-btn" hidden>记录</button>
    <button type="button" id="library-btn" class="chip chip-btn" hidden>论文</button>
    <button type="button" id="mode-chip" class="chip chip-btn" hidden></button>
  </div>
</header>

<main id="layout" class="layout" data-view="both">
  <section id="paper-pane" class="pane paper-pane" aria-label="论文原文" tabindex="0">
    <article id="paper" class="paper"></article>
  </section>

  <div id="divider" class="divider" role="separator" aria-orientation="vertical" aria-label="拖动调整两边的宽度，双击恢复默认" aria-valuemin="25" aria-valuemax="75" tabindex="0"></div>

  <section class="pane agent-pane" aria-label="讲解">
    <div class="reading-preparation">
    <section id="reading-context" class="reading-context" aria-labelledby="reading-context-heading" hidden>
      <div data-context-editor>
        <h2 id="reading-context-heading">读这篇论文需要哪些基础？</h2>
        <p class="hint">先根据本文列出必需的知识，再由你选择已经会的和需要补的。开始前可以在右上角选模型。</p>
        <button type="button" data-context-prepare class="btn btn-primary">先看看需要哪些基础</button>
        <p data-context-progress class="status" role="status"></p>
        <button type="button" data-context-stop class="btn btn-small" hidden>停止分析</button>
        <div data-context-choices hidden>
          <p id="reading-context-hint" class="hint">每项都可以选“不确定”。清单本身不会记成“讲过”或“已经会”；确认后保存你的选择，重新打开会再问。</p>
          <div data-context-list class="prerequisite-list"></div>
          <label for="reading-context-input">这次想读懂什么？（可不填）</label>
          <textarea id="reading-context-input" data-context-input rows="2" maxlength="2000" autocomplete="off" aria-describedby="reading-context-hint reading-context-error" placeholder="例如：先理解主要结论，再看必要推导。"></textarea>
          <div class="reading-context-actions">
            <button type="button" data-context-confirm class="btn btn-primary">确认本次选择</button>
            <button type="button" data-context-zero class="btn">全部从基础讲起</button>
            <button type="button" data-context-cancel class="btn btn-small" hidden>取消修改</button>
          </div>
        </div>
        <p id="reading-context-error" data-context-error class="reading-context-error" role="alert"></p>
      </div>
      <div data-context-summary class="reading-context-summary" hidden>
        <p data-context-description></p>
        <button type="button" data-context-edit class="btn btn-small">修改本次基础</button>
      </div>
    </section>
    <section id="record-confirm" class="record-confirm" aria-label="上次读这篇时的记录" hidden></section>
    </div>
    <div id="cards" class="cards" aria-live="polite"></div>

    <form id="composer" class="composer">
      <p id="status" class="status" role="status"></p>
      <div id="quote-chip" class="quote-chip" hidden>
        <span class="quote-label">选中的原文</span>
        <span id="quote-text" class="quote-text"></span>
        <button type="button" id="quote-clear" class="icon-btn" aria-label="取消选中的原文">×</button>
      </div>
      <div id="pdf-fields" class="pdf-fields" hidden>
        <label class="pdf-page">页码
          <input id="pdf-page" type="number" min="1" step="1" inputmode="numeric" placeholder="如 3">
        </label>
        <label class="pdf-quote">原文片段
          <input id="pdf-quote" type="text" placeholder="把想问的那句原文粘贴到这里" autocomplete="off">
        </label>
      </div>
      <div class="composer-row">
        <label class="sr-only" for="question">想问的问题</label>
        <textarea id="question" rows="1" placeholder="直接写问题，或先在左边选中一段原文"></textarea>
        <div class="composer-actions">
          <button type="button" id="pdf-toggle" class="btn btn-quiet" aria-controls="pdf-fields" aria-expanded="false" hidden>引用原文</button>
          <button type="submit" id="ask-btn" class="btn" disabled>提问</button>
          <button type="button" id="continue-btn" class="btn btn-primary">继续</button>
        </div>
      </div>
    </form>
  </section>
</main>

<button type="button" id="ask-selection" class="ask-selection" hidden>问这一段</button>

<dialog id="library-dialog" class="dialog" aria-labelledby="library-heading">
  <header class="dialog-head">
    <h2 id="library-heading">论文</h2>
    <button type="button" class="icon-btn" data-close aria-label="关闭">×</button>
  </header>
  <div id="library-body" class="dialog-body"></div>
</dialog>

<dialog id="record-dialog" class="dialog" aria-labelledby="record-heading">
  <header class="dialog-head">
    <h2 id="record-heading">概念记录</h2>
    <button type="button" class="icon-btn" data-close aria-label="关闭">×</button>
  </header>
  <div id="record-body" class="dialog-body"></div>
</dialog>

<dialog id="map-dialog" class="map-dialog" aria-labelledby="map-heading">
  <header class="map-head">
    <h2 id="map-heading">概念地图</h2>
    <p id="map-status" class="status" role="status"></p>
    <button type="button" id="map-add-note" class="btn btn-small">加一张批注</button>
    <button type="button" class="icon-btn" data-close aria-label="关闭">×</button>
  </header>
  <div id="map-frame" class="map-frame"><div id="map-stage" class="map-stage"></div></div>
</dialog>

<dialog id="settings-dialog" class="dialog" aria-labelledby="settings-heading">
  <header class="dialog-head">
    <h2 id="settings-heading">模型后端</h2>
    <button type="button" class="icon-btn" data-close aria-label="关闭">×</button>
  </header>
  <div id="settings-body" class="dialog-body"></div>
</dialog>

<div id="drop-overlay" class="drop-overlay" hidden><p>松开，打开这份 PDF</p></div>

<script defer src="vendor/katex/katex.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
